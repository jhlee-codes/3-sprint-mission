# Nginx 리버스 프록시 설정

upstream spring_backend {
  # 라운드 로빈 방식 (기본값)
  server 3-sprint-mission-backend-1:8080 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-2:8080 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-3:8080 max_fails=3 fail_timeout=30s;
  keepalive 64;
}

upstream spring_backend_least {
  # 최소 연결수 기반
  least_conn;
  server 3-sprint-mission-backend-1:8080 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-2:8080 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-3:8080 max_fails=3 fail_timeout=30s;
  keepalive 64;
}

upstream spring_backend_ip {
  # 클라이언트 IP 해시 기반
  ip_hash;
  server 3-sprint-mission-backend-1:8080 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-2:8080 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-3:8080 max_fails=3 fail_timeout=30s;
  keepalive 64;
}

upstream spring_backend_weight {
  # 가중치 기반
  server 3-sprint-mission-backend-1:8080 weight=3 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-2:8080 weight=2 max_fails=3 fail_timeout=30s;
  server 3-sprint-mission-backend-3:8080 weight=1 max_fails=3 fail_timeout=30s;
  keepalive 64;
}

server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_set_header Host $host;

  # 타임아웃 설정
  proxy_connect_timeout 30s;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  location /api/ {
    proxy_pass http://spring_backend_least;
    add_header X-Upstream-Server $upstream_addr always;
  }

  location /ws/ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_pass http://spring_backend_least;
    add_header X-Upstream-Server $upstream_addr always;
  }

  location /nginx_status {
    stub_status on;
    access_log off;
    allow all;
    deny all;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}